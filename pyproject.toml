[project]
name = "pvdend"
version = "0.1.0"
description = "Dendritic integration and Ca_LVA channels in a human L2/3 PV+ interneuron model: short (100 um) vs grown (400 um) dendrite"
readme = "README.md"
license = "BSD-3-Clause"
requires-python = ">=3.10"
dependencies = [
    "neuron>=8.2",
    "numpy>=1.24",
    "pandas>=1.5",
    "matplotlib>=3.7",
    "ipywidgets>=8.0",
]

[project.optional-dependencies]
dev = ["pytest>=7", "jupyterlab>=4", "nbclient>=0.10", "ipykernel>=6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pvdend"]

[tool.pytest.ini_options]
testpaths = ["tests"]
